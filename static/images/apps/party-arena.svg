  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <g transform="translate(21.1 13.1) scale(20.08)" filter="url(#shadow)">
      
