        <path d="M7.4,11.3h1.6v-1.6h1.5v1.6h1.6v1.5h-1.6v1.6h-1.5v-1.6h-1.6v-1.5z" fill="#FF2D55"/>
        <path d="M14.6,10.9h3.4v1.7h-3.4zM14.6,13.4h3.4v1.7h-3.4z" fill="#FF6B8A"/>
