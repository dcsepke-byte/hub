<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HUB — Danny's Central Workspace</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUB">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/icon.svg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260802h">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/sw-register.js') }}" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark">
  <div class="ambient-bg"></div>

  <header class="topbar glass">
    <div class="brand">
      <a href="#home" id="homeBtn" class="nav-icon active" title="Home"><img src="{{ url_for('static', filename='images/apps/hub.png') }}" alt="" width="32" height="32"></a>
      <span>HUB</span>
    </div>

    <div class="top-actions">
      <button id="themeToggle" class="icon-btn" title="Theme">🌗</button>
      <div class="search-wrap">
        <input type="text" id="globalSearch" placeholder="Suchen..." autocomplete="off">
        <div class="search-results glass" id="searchResults"></div>
      </div>
    </div>
  </header>

  <div id="overlay"></div>

  <aside id="quickAddModal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Schnell hinzufügen</h3>
        <button class="close-modal">×</button>
      </div>
      <div class="modal-body">
        <div class="quick-types">
          <button class="quick-type active" data-type="task">Task</button>
          <button class="quick-type" data-type="note">Notiz</button>
          <button class="quick-type" data-type="event">Termin</button>
          <button class="quick-type" data-type="file">Datei</button>
        </div>
        <form id="quickForm">
          <input type="text" id="quickTitle" placeholder="Titel" required>
          <select id="quickProject">
            <option value="Persoenlich">Persönlich</option>
            <option value="Party Arena">Party Arena</option>
            <option value="KI-Videos">KI-Videos</option>
            <option value="Hochzeit">Hochzeit</option>
            <option value="Server">Server</option>
            <option value="Klavier-Coach">Klavier-Coach</option>
          </select>
          <input type="date" id="quickDue" placeholder="Fällig am" style="display:none">
          <input type="datetime-local" id="quickEventTime" style="display:none">
          <input type="file" id="quickFile" style="display:none">
          <button type="submit" class="btn-primary">Erstellen</button>
        </form>
      </div>
    </div>
  </aside>

  <main id="content"></main>

  <nav id="bottomNav" class="bottom-nav glass">
    <button data-page="home" class="active">🏠<span>Home</span></button>
    <button data-page="projects">📁<span>Projekte</span></button>
    <button data-page="tasks">✅<span>Tasks</span></button>
    <button data-page="explorer">📂<span>Dateien</span></button>
    <button data-page="settings">⚙️<span>Einstell.</span></button>
    <button class="fab-small" id="fab">+</button>
  </nav>

  <script src="{{ url_for('static', filename='js/app.js') }}?v=20260802d"></script>
</body>
</html>
